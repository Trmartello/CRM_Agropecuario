<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Copérdia">
  <defs>
    <linearGradient id="gVerdeC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc63f"/>
      <stop offset=".5" stop-color="#2f9e4f"/>
      <stop offset="1" stop-color="#0c6b38"/>
    </linearGradient>
    <linearGradient id="gOuroC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e08a"/>
      <stop offset=".5" stop-color="#eec93f"/>
      <stop offset="1" stop-color="#d99a2b"/>
    </linearGradient>
  </defs>

  <!-- Fita verde: da base esquerda ao alto, cruzando para a direita -->
  <path d="M 52 112
           C 76 42, 152 8, 226 34
           L 208 56
           C 152 34, 100 58, 80 114
           Z" fill="url(#gVerdeC)"/>

  <!-- Fita dourada: nasce sob a verde e desce à base direita -->
  <path d="M 118 78
           C 158 40, 214 40, 252 96
           L 224 106
           C 198 68, 158 66, 136 92
           Z" fill="url(#gOuroC)"/>

  <!-- Letreiro branco (para fundos escuros) -->
  <text x="150" y="164" text-anchor="middle"
        font-family="'Arial Black', Arial, Helvetica, sans-serif"
        font-size="45" font-weight="900" letter-spacing="1"
        fill="#ffffff">COPÉRDIA</text>
</svg>
